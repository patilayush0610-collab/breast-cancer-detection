<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🎗 Breast Cancer Detection System</h1>

    <form action="/predict" method="POST">

        <input type="number" step="any" name="radius_mean" placeholder="Radius Mean" required>

        <input type="number" step="any" name="texture_mean" placeholder="Texture Mean" required>

        <input type="number" step="any" name="perimeter_mean" placeholder="Perimeter Mean" required>

        <input type="number" step="any" name="area_mean" placeholder="Area Mean" required>

        <input type="number" step="any" name="concavity_mean" placeholder="Concavity Mean" required>

        <input type="number" step="any" name="concave_points_mean" placeholder="Concave Points Mean" required>

        <input type="number" step="any" name="radius_worst" placeholder="Radius Worst" required>

        <input type="number" step="any" name="perimeter_worst" placeholder="Perimeter Worst" required>

        <input type="number" step="any" name="area_worst" placeholder="Area Worst" required>

        <input type="number" step="any" name="concave_points_worst" placeholder="Concave Points Worst" required>

        <button type="button" onclick="fillSampleData()" class="sample-btn">
            Load Sample Data
        </button>

        <button type="submit">
            Predict Cancer Risk
        </button>

    </form>

    {% if prediction_text %}
    <div class="result">
        <h2>{{ prediction_text }}</h2>
        <h3>Confidence Score: {{ confidence }}%</h3>

        <p class="disclaimer">
            This result is generated by a Machine Learning model and should not be considered a medical diagnosis. Please consult a qualified healthcare professional.
        </p>
    </div>
    {% endif %}

</div>

<script>

function fillSampleData(){

document.getElementsByName("radius_mean")[0].value = 13.54;
document.getElementsByName("texture_mean")[0].value = 14.36;
document.getElementsByName("perimeter_mean")[0].value = 87.46;
document.getElementsByName("area_mean")[0].value = 566.3;
document.getElementsByName("concavity_mean")[0].value = 0.06664;
document.getElementsByName("concave_points_mean")[0].value = 0.04781;
document.getElementsByName("radius_worst")[0].value = 15.11;
document.getElementsByName("perimeter_worst")[0].value = 99.7;
document.getElementsByName("area_worst")[0].value = 711.2;
document.getElementsByName("concave_points_worst")[0].value = 0.1288;

}

</script>

</body>
</html>
